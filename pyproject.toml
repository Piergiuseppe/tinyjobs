[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinyjobs"
version = "0.7.3"
description = "Background jobs and cron for Python, on SQLite, with zero dependencies"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Piergiuseppe D'Abbraccio", email = "piergiuseppedabbraccio@gmail.com" },
]
keywords = ["jobs", "queue", "cron", "background", "sqlite", "postgres", "redis", "worker", "tasks", "django", "fastapi"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

[project.optional-dependencies]
redis = ["redis>=5.0.1"]
postgres = ["psycopg[binary]>=3.2,<3.4", "psycopg-pool>=3.2,<3.4"]

[project.urls]
Homepage = "https://github.com/Piergiuseppe/tinyjobs"
Documentation = "https://tinyjobs.readthedocs.io/"
Repository = "https://github.com/Piergiuseppe/tinyjobs"
Issues = "https://github.com/Piergiuseppe/tinyjobs/issues"

[project.scripts]
tinyjobs = "tinyjobs.cli:main"

[project.entry-points."tinyjobs.backends"]
sqlite = "tinyjobs.backends.sqlite:SQLiteBackend.from_url"

[tool.hatch.build.targets.wheel]
packages = ["tinyjobs"]
