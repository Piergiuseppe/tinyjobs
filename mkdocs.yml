site_name: tinyjobs
site_description: Background jobs and cron for Python, on SQLite, with zero dependencies
site_url: https://tinyjobs.readthedocs.io/
repo_url: https://github.com/Piergiuseppe/tinyjobs
repo_name: Piergiuseppe/tinyjobs
edit_uri: ""

docs_dir: docs
exclude_docs: |
  __pycache__/
  hooks.py
  requirements.txt

hooks:
  - docs/hooks.py

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
