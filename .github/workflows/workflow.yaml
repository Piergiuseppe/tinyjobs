name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TINYJOBS_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the redis extra, fastapi and django
        run: python -m pip install "redis>=5.0.1" fastapi httpx "django>=6.0; python_version >= '3.12'"

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . --verbose

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the tag matches the packaged version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'CHECK'
          import os
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          tag = os.environ["TAG"].removeprefix("v")
          if tag != version:
              sys.exit(
                  f"tag {tag!r} does not match the version in pyproject.toml "
                  f"({version!r}); PyPI version numbers cannot be reused, so "
                  f"this run is stopping before it publishes"
              )
          print(f"tag and pyproject agree on {version}")
          CHECK

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the wheel installs and reports the version it claims
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          expected=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          imported=$(/tmp/check/bin/python -c "import tinyjobs; print(tinyjobs.__version__)")
          reported=$(/tmp/check/bin/tinyjobs --version)
          echo "pyproject=$expected  import=$imported  cli=$reported"
          test "$imported" = "$expected"
          test "$reported" = "tinyjobs $expected"

      - uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: tinyjobs
      url: https://pypi.org/p/tinyjobs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distribution
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
