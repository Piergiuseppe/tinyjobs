name: ci

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "mkdocs.yml"
      - ".readthedocs.yaml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        postgres: ["14", "18"]
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: tinyjobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TINYJOBS_REDIS_URL: redis://localhost:6379/0
      TINYJOBS_POSTGRES_URL: postgresql://postgres:tinyjobs@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the redis and postgres extras, fastapi and django
        run: python -m pip install "redis>=5.0.1" "psycopg[binary]>=3.2" "psycopg-pool>=3.2" fastapi httpx "django>=6.0; python_version >= '3.12'"

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . --verbose

  test-free-threaded:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: tinyjobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TINYJOBS_REDIS_URL: redis://localhost:6379/0
      TINYJOBS_POSTGRES_URL: postgresql://postgres:tinyjobs@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14t"

      - name: Install libpq for the pure Python psycopg
        run: sudo apt-get update && sudo apt-get install -y libpq5

      - name: Install redis without hiredis, psycopg without its binary wheel, fastapi and django
        run: python -m pip install "redis>=5.0.1" "psycopg>=3.2" "psycopg-pool>=3.2" fastapi httpx "django>=6.0"

      - name: Run the test suite with the GIL off
        run: |
          python -c "import sys; assert not sys._is_gil_enabled()"
          python -m unittest discover -s tests -t . --verbose

  build:
    needs: [test, test-free-threaded]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check the tag matches tinyjobs.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'CHECK'
          import os
          import re
          import sys

          source = open("tinyjobs/__init__.py").read()
          version = re.search(r'^__version__ = "(.+)"$', source, re.M)[1]
          tag = os.environ["TAG"].removeprefix("v")
          if tag != version:
              sys.exit(
                  f"tag {tag!r} does not match tinyjobs.__version__ "
                  f"({version!r}); PyPI version numbers cannot be reused, so "
                  f"this run is stopping before it publishes"
              )
          print(f"tag and tinyjobs.__version__ agree on {version}")
          CHECK

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the wheel installs and reports the version it claims
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          expected=$(python -c "import re; print(re.search(r'^__version__ = \"(.+)\"$', open('tinyjobs/__init__.py').read(), re.M)[1])")
          packaged=$(/tmp/check/bin/python -I -c "from importlib.metadata import version; print(version('tinyjobs'))")
          imported=$(/tmp/check/bin/python -I -c "import tinyjobs; print(tinyjobs.__version__)")
          reported=$(/tmp/check/bin/tinyjobs --version)
          echo "source=$expected  packaged=$packaged  import=$imported  cli=$reported"
          test "$packaged" = "$expected"
          test "$imported" = "$expected"
          test "$reported" = "tinyjobs $expected"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

  ci-passed:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless the tests and the build succeeded
        env:
          BUILD: ${{ needs.build.result }}
        run: test "$BUILD" = success

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: tinyjobs
      url: https://pypi.org/p/tinyjobs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Take this version's section of the changelog as the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'NOTES'
          import os
          import pathlib
          import re

          version = re.escape(os.environ["TAG"].removeprefix("v"))
          changelog = pathlib.Path("CHANGELOG.md")
          text = changelog.read_text() if changelog.exists() else ""
          section = re.search(rf"^## {version}(?=\s).*?\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          notes = re.sub(r"\n[ \t]+(?=[^\s*+-])", " ", section[1]).strip() if section else ""
          pathlib.Path("notes.md").write_text(notes)
          print(notes or "no section for this version in CHANGELOG.md")
          NOTES

      - name: Publish the GitHub release, with notes generated from the merged pull requests when the changelog has none
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -s notes.md ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file notes.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
